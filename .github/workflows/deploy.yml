name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate PDFs from index.html
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          mkdir -p dist
          cp index.html dist/
          "$CHROME" --headless --disable-gpu --no-sandbox --no-pdf-header-footer \
            --print-to-pdf="$PWD/dist/cv-isipchuk.pdf" "file://$PWD/index.html?lang=en"
          "$CHROME" --headless --disable-gpu --no-sandbox --no-pdf-header-footer \
            --print-to-pdf="$PWD/dist/cv-isipchuk-ru.pdf" "file://$PWD/index.html?lang=ru"

      - name: Verify PDFs
        run: |
          test -s dist/cv-isipchuk.pdf && file dist/cv-isipchuk.pdf
          test -s dist/cv-isipchuk-ru.pdf && file dist/cv-isipchuk-ru.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
